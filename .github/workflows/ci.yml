name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.200

      - name: Restore
        run: dotnet restore SDM.sln

      - name: Build
        run: dotnet build SDM.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SDM.sln --configuration Release --no-build

      # The extension is not built and no test project reads it, so every fault in it has
      # reached a browser before anyone noticed. This loads it the way Chrome does.
      - name: Check the browser extension
        run: node tools/check-extension.mjs
